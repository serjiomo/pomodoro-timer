name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: dist/
          retention-days: 7

  build-linux:
    name: Build Linux Desktop (AppImage)
    runs-on: ubuntu-latest
    needs: build-web
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libuuid1 \
            rpm \
            fakeroot

      - name: Install Node.js dependencies
        run: |
          npm ci
          cd desktop
          npm install

      - name: Download web build
        uses: actions/download-artifact@v6
        with:
          name: web-build
          path: dist/

      - name: Generate icon
        run: |
          cd desktop
          node generate-icon.js

      - name: Build AppImage package
        run: |
          cd desktop
          npm run build:appimage

      - name: Upload AppImage package
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Pomodoro Focus v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/linux-appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-success:
    name: Build Success Check
    runs-on: ubuntu-latest
    needs: [build-web, build-linux]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-web.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ All builds completed successfully"
